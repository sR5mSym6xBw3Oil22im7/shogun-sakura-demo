services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:?MCP_INTERNAL_TOKEN is required}
      MCP_BASE_URL: ${MCP_BASE_URL:?MCP_BASE_URL is required}
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,null
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
    ports:
      - "8080:8080"

services:
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html/frontend:ro
    ports:
      - "5500:80"

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:?MCP_INTERNAL_TOKEN is required}
      MCP_BASE_URL: ${MCP_BASE_URL:?MCP_BASE_URL is required}
      SITE_SOURCE_BASE_URL: http://frontend/frontend/
      ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,null
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "8080:8080"

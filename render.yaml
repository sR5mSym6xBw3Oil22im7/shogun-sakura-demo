services:
  - type: web
    name: shogun-sakura-demo
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5500,http://127.0.0.1:5500,https://sr5msym6xbw3oil22im7.github.io,null
      - key: MCP_INTERNAL_TOKEN
        generateValue: true

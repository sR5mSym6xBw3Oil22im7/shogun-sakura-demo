services:
  - type: web
    name: shogun-sakura-demo
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5500,http://127.0.0.1:5500,https://sr5msym6xbw3oil22im7.github.io

services:
  - type: web
    name: shogun-sakura-demo-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/shogun-sakura-demo-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

services:
  - type: web
    name: shogun-sakura-demo-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5500,http://127.0.0.1:5500,https://sr5msym6xbw3oil22im7.github.io

services:
  - type: web
    name: shogun-sakura-demo
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        sync: false
      - key: ORDER_STORAGE_PATH
        value: /tmp/shogun-sakura/orders.txt
      - key: ALLOWED_ORIGINS
        value: http://localhost:5500,http://127.0.0.1:5500,https://sr5msym6xbw3oil22im7.github.io

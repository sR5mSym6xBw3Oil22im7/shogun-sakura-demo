<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    画面はバックエンド（Spring Boot / Render）から配信する構成へ移行した。
    この URL にアクセスされた場合は、バックエンドのトップページへ遷移する。
  -->
  <meta http-equiv="refresh" content="0; url=https://shogun-sakura-demo.onrender.com/">
  <title>SHOGUN SAKURA</title>
  <script>
    (function () {
      var isLocal = location.protocol === 'file:' ||
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1' ||
        location.hostname === '[::1]' ||
        location.hostname === '';
      var backendUrl = isLocal ? 'http://localhost:8080/' : 'https://shogun-sakura-demo.onrender.com/';
      window.location.replace(backendUrl + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body>
  <p><a href="https://shogun-sakura-demo.onrender.com/">SHOGUN SAKURA へ移動します</a></p>
</body>
</html>

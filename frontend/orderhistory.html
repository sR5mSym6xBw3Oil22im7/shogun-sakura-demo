<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="注文履歴一覧表示">
  <title>注文履歴一覧表示 | SHOGUN SAKURA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="history-page">
  <header class="topbar">
    <div class="brand">SHOGUN SAKURA</div>
    <div class="header-right">
      <nav class="global-nav" aria-label="ページ移動">
        <a href="./index.html">注文入力</a>
      </nav>
      <div class="demo-badge">注文履歴デモ</div>
    </div>
  </header>

  <main>
    <section class="hero history-hero history-hero--compact">
      <div class="copy">
        <p class="sub">注文履歴</p>
        <h1>注文履歴一覧表示</h1>
        <p>
          Render の Web Service が受領した注文データを、 PostgreSQL の <code>orders</code> テーブルから一覧表示します。
        </p>
        <a class="btn" href="./index.html">注文入力画面へ戻る</a>
      </div>
    </section>

    <section class="purchase history-section" id="history">
      <div class="purchase-card">
        <p class="sub">注文一覧</p>
        <h2>注文履歴一覧</h2>
        <p>注文ID、氏名、数量、合計金額、登録日時を一覧で確認できます。</p>

        <div class="history-status" data-history-status aria-live="polite"></div>
        <div class="history-table-shell">
          <table class="history-table">
            <thead>
              <tr>
                <th>注文ID</th>
                <th>商品名</th>
                <th>氏名</th>
                <th>メール</th>
                <th>郵便番号</th>
                <th>住所</th>
                <th>数量</th>
                <th>合計金額</th>
                <th>備考</th>
                <th>登録日時</th>
              </tr>
            </thead>
            <tbody data-history-body></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer>SHOGUN SAKURA / 注文履歴デモ</footer>

  <script>
    window.API_BASE_URL = (
      location.hostname === 'localhost' ||
      location.hostname === '127.0.0.1' ||
      location.protocol === 'file:'
    )
      ? 'http://localhost:8080'
      : 'https://shogun-sakura-demo.onrender.com';
  </script>
  <script src="js/orderhistory.js"></script>
</body>
</html>
